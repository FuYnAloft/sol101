name: 更新、构建与部署
on:
  push:
    paths:
      - 'docs/**'
      - 'templates/**'
      - '**.py'
      - '.github/workflows/update-and-build.yml'
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制进行构建部署'
        required: false
        type: boolean
        default: false

jobs:
  update-generate-build:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      SITE_BASE: /sol101/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore/Save ETags Cache
        uses: actions/cache@v4
        with:
          # 存放 etag 文件的目录
          path: etag
          # 1. 使用包含 run_id 或时间戳的唯一 Key，确保每次运行结束后都能“存入”新内容
          key: etags-${{ github.run_id }}
          # 2. 核心：通过 restore-keys 匹配最近一次存入的缓存
          restore-keys: |
            etags-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Uv sync
        run: uv sync --no-dev

      - name: Run update.py and check result
        id: update
        run: |
          output=$(uv run update.py)
          echo "$output"
          last_line=$(echo "$output" | tail -n 1)
          echo "updated=$last_line" >> $GITHUB_OUTPUT

      - name: Check if build is necessary
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ||"${{ steps.update.outputs.updated }}" == "true" || "${{ inputs.force_build }}" == "true" ]]; then
              echo "build=true" >> $GITHUB_OUTPUT
          else
              echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Run generate.py
        if: steps.check.outputs.build == 'true'
        run: uv run generate.py

      - name: Set up Node.js
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
            node-version: '20'
            cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.build == 'true'
        run: npm ci

      - name: Build VitePress site
        if: steps.check.outputs.build == 'true'
        run: npm run docs:build

      - name: Upload artifact
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-generate-build
    if: needs.update-generate-build.outputs.build == 'true'
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4




