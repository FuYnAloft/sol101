name: Auto Update, Split and Commit

on:
  push:
    paths:
      # 当 push 且修改了 config.py 时触发
      - 'config.py'
  schedule:
    # 每天 00:00 UTC 运行
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '强制执行全量更新'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update.py and check result
        id: update
        run: |
          # 初始化参数为空
          ARGS=""
          
          # 判断条件：如果是 push 事件，或者是手动触发且勾选了 force_update
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.force_update }}" == "true" ]]; then
            ARGS="--force"
          fi

          # 执行 Python 脚本，带上可能的参数
          output=$(python update.py $ARGS)
          
          echo "$output"
          last_line=$(echo "$output" | tail -n 1)
          echo "updated=$last_line" >> $GITHUB_OUTPUT
          
          # 校验输出
          if [[ "$last_line" != "true" && "$last_line" != "false" ]]; then
            echo "Error: update.py returned unexpected value: $last_line"
            echo "Expected 'true' or 'false'"
            exit 1
          fi

      - name: Run split.py
        if: steps.update.outputs.updated == 'true'
        run: python split.py

      - name: Commit and push changes
        if: steps.update.outputs.updated == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Auto update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push